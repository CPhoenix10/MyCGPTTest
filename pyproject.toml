[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "fs42stream"
version = "0.1.0"
description = "Wall-clock-correct FieldStation42 to Jellyfin live stream bridge"
requires-python = ">=3.11"
dependencies = []

[project.scripts]
fs42stream = "fs42stream.server:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
